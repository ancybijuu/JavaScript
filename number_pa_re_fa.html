    <script>
        
// ==================================
// 1. CHECK NUMBER PALINDROME
// ==================================

console.log("1. Number Palindrome");

let num1 = 121;
let original = num1;
let reverse = 0;

while (num1 > 0) {
    let digit = num1 % 10;
    reverse = reverse * 10 + digit;
    num1 = Math.floor(num1 / 10);
}

if (original === reverse) {
    console.log(original + " is a Palindrome");
} else {
    console.log(original + " is Not a Palindrome");
}


// ==================================
// 2. REVERSE A NUMBER
// ==================================

console.log("\n2. Reverse a Number");

let num2 = 12345;
let reversed = 0;

while (num2 > 0) {
    let digit = num2 % 10;
    reversed = reversed * 10 + digit;
    num2 = Math.floor(num2 / 10);
}

console.log("Reversed number =", reversed);


// ==================================
// 3. FACTORIAL OF A NUMBER
// ==================================

console.log("\n3. Factorial of a Number");

let num3 = 5;
let factorial = 1;

for (let i = 1; i <= num3; i++) {
    factorial = factorial * i;
}

console.log("Factorial of " + num3 + " =", factorial);

    </script>
