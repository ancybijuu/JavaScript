<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = Number(prompt("enter the number:"));

        if (number > 0){
            console.log("POSITIVE");
        }
        else if(number < 0){
            console.log("NEGATIVE");
        }
        else{
            console.log("ZERO");
        }
    </script>
</body>
</html>
