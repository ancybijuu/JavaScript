
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 30px;
        }

        .profile {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #cccccc;
        }

        .student-name {
            color: blue;
            font-size: 20px;
        }

        #status {
            color: red;
            font-weight: bold;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="profile" id="profileSection">

        <h1 id="mainHeading">Student Profile</h1>

        <img
            id="studentImage"
            src="https://placehold.co/100x100?text=Student"
            alt="Student Image"
        >

        <p class="student-name" id="studentName">
            Name: Anu
        </p>

        <p id="studentAge">Age: 20</p>

        <p id="studentCourse">
            Course: Full Stack Development
        </p>

        <p id="status">Status: Not Updated</p>

    </div>

    <script>
        // 1. Select the heading using getElementById()
        let heading = document.getElementById("mainHeading");

        // Change the heading text using textContent
        heading.textContent = "Student Information";


        // 2. Select the student name using getElementsByClassName()
        let name = document.getElementsByClassName("student-name");

        // Change the student's name using innerHTML
        name[0].innerHTML = "Name: Meera";


        // 3. Select the course using querySelector()
        let course = document.querySelector("#studentCourse");

        // Change the course
        course.textContent = "Course: MERN Stack Development";


        // 4. Change the status message
        let status = document.getElementById("status");

        status.textContent = "Profile Updated Successfully!";


        // 5. Change the status text color to green
        status.style.color = "green";


        // 6. Change the profile background color
        let profile = document.getElementById("profileSection");

        profile.style.backgroundColor = "#e0ffe0";


        // 7. Increase the student's name font size
        name[0].style.fontSize = "26px";


        // 8. Change the image's alt attribute
        let image = document.getElementById("studentImage");

        image.setAttribute("alt", "Student Profile Image");


        // Display confirmation in the console
        console.log("Student profile updated successfully!");
    </script>

</body>
</html>
