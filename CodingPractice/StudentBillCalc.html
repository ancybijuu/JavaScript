
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bill Calculator</title>
</head>
<body>

    <h1>Student Bill Calculator</h1>
    <p>Enter the quantities when prompted.</p>
    <p>Open the browser console (F12 → Console) to view the bill.</p>

    <script>
        // Item Prices
        const notebookPrice = 80;
        const penPrice = 20;
        const pencilPrice = 10;

        // Get quantities from the student
        let notebookQuantity = Number(prompt("Enter the quantity of notebooks:"));
        let penQuantity = Number(prompt("Enter the quantity of pens:"));
        let pencilQuantity = Number(prompt("Enter the quantity of pencils:"));

        // Calculate the cost of each item
        let notebookCost = notebookPrice * notebookQuantity;
        let penCost = penPrice * penQuantity;
        let pencilCost = pencilPrice * pencilQuantity;

        // Calculate the total bill
        let totalBill = notebookCost + penCost + pencilCost;

        // Amount given by the student
        const amountPaid = 500;

        // Calculate the remaining amount
        let remainingAmount = amountPaid - totalBill;

        // Display the bill in the console
        console.log("===== STUDENT BILL =====");

        console.log("Notebook Price: ₹" + notebookPrice);
        console.log("Notebook Quantity: " + notebookQuantity);
        console.log("Notebook Cost: ₹" + notebookCost);

        console.log("Pen Price: ₹" + penPrice);
        console.log("Pen Quantity: " + penQuantity);
        console.log("Pen Cost: ₹" + penCost);

        console.log("Pencil Price: ₹" + pencilPrice);
        console.log("Pencil Quantity: " + pencilQuantity);
        console.log("Pencil Cost: ₹" + pencilCost);

        console.log("------------------------");
        console.log("Total Bill: ₹" + totalBill);
        console.log("Amount Paid: ₹" + amountPaid);

        if (remainingAmount >= 0) {
            console.log("Remaining Amount: ₹" + remainingAmount);
        } else {
            console.log("Additional Amount Required: ₹" + Math.abs(remainingAmount));
        }

        console.log("========================");
    </script>

</body>
</html>
