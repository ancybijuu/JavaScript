
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>

    <h1>Student Profile Program</h1>
    <p>Open the browser console (F12 → Console) to view the student details.</p>

    <script>
        // Student Information
        let studentName = "Anu";
        let age = 20;
        let course = "Python Full Stack Development";

        // Subject Marks
        let mark1 = 85;
        let mark2 = 90;
        let mark3 = 75;

        // Number of Subjects
        let numberOfSubjects = 3;

        // Calculate Total Marks
        let totalMarks = mark1 + mark2 + mark3;

        // Calculate Average Marks
        let averageMarks = totalMarks / numberOfSubjects;

        // Display Student Profile
        console.log("===== STUDENT PROFILE =====");
        console.log("Student Name: " + studentName);
        console.log("Age: " + age);
        console.log("Course: " + course);
        console.log("Number of Subjects: " + numberOfSubjects);

        console.log("===== MARKS DETAILS =====");
        console.log("Subject 1 Marks: " + mark1);
        console.log("Subject 2 Marks: " + mark2);
        console.log("Subject 3 Marks: " + mark3);

        console.log("Total Marks: " + totalMarks);
        console.log("Average Marks: " + averageMarks);
    </script>

</body>
</html>
